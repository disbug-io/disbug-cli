version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - prealloc
    - unconvert
  settings:
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/disbug-io/disbug-cli
