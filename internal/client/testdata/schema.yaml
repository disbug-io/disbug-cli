openapi: 3.0.3
info:
  title: Disbug Backend Agent API
  version: 0.1.0
  description: Contract fixture for the standalone CLI client.
servers:
  - url: https://api.disbug.io
security:
  - bearerAuth: []
paths:
  /api/me/:
    get:
      operationId: GetMe
      summary: Get the current authenticated agent and team context.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current agent and team context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/agent/revoke/:
    post:
      operationId: RevokeToken
      summary: Revoke the current agent token.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/search/:
    get:
      operationId: Search
      summary: Search sessions or pins.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query text.
          schema:
            type: string
            minLength: 1
        - name: scope
          in: query
          required: false
          description: Search scope.
          schema:
            type: string
            enum:
              - sessions
              - pins
            default: sessions
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Search results for the selected scope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchSessionsResponse"
                  - $ref: "#/components/schemas/SearchPinsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/:
    get:
      operationId: ListSessions
      summary: List accessible sessions.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter sessions by lifecycle status.
          schema:
            type: string
            enum:
              - open
              - resolved
              - dismissed
        - name: project
          in: query
          required: false
          description: Filter sessions by project identifier or slug.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of sessions to return.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous list response.
          schema:
            type: string
      responses:
        "200":
          description: Paginated session summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/:
    get:
      operationId: GetSession
      summary: Get a session detail.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sessions/{id}/pins/by-number/{n}/:
    get:
      operationId: GetPinByNumber
      summary: Get a pin by its display number within a session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: n
          in: path
          required: true
          description: Pin number within the session.
          schema:
            type: integer
            minimum: 1
        - name: fields
          in: query
          required: false
          description: Optional expanded fields to include.
          schema:
            type: string
            enum:
              - screenshot
              - console_logs
              - network_logs
              - user_events
              - session_replay
              - voice_note
              - video_recording
      responses:
        "200":
          description: Pin detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinFull"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sessions/{id}/pins/{pid}/:
    get:
      operationId: GetPin
      summary: Get a pin by its backend identifier.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: pid
          in: path
          required: true
          description: Pin identifier.
          schema:
            type: integer
            minimum: 1
        - name: fields
          in: query
          required: false
          description: Optional expanded fields to include.
          schema:
            type: string
            enum:
              - screenshot
              - console_logs
              - network_logs
              - user_events
              - session_replay
              - voice_note
              - video_recording
      responses:
        "200":
          description: Pin detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinFull"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      description: Session identifier.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The agent token is not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - code
        - detail
        - request_id
      properties:
        code:
          type: string
          enum:
            - bad_request
            - auth_required
            - token_revoked
            - owner_team_lost
            - agent_read_only
            - free_tier_locked
            - not_found
            - rate_limited
            - internal_error
        detail:
          type: string
        request_id:
          type: string
    Me:
      type: object
      required:
        - agent_name
        - team
        - team_slug
        - created_by_email
        - token_prefix
        - last_used_at
        - api_version
        - capabilities
      properties:
        agent_name:
          type: string
        team:
          type: string
        team_slug:
          type: string
        created_by_email:
          type: string
          format: email
        token_prefix:
          type: string
        last_used_at:
          type: string
          format: date-time
        api_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
              - search
              - pin_field_selection
              - pin_by_number
    Project:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
    Reporter:
      type: object
      required:
        - email
        - display_name
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
    ListSessionsResponse:
      type: object
      required:
        - results
        - next_cursor
        - count
        - free_tier_truncated
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: string
          nullable: true
        count:
          type: integer
          minimum: 0
        free_tier_truncated:
          type: boolean
    SessionSummary:
      type: object
      required:
        - id
        - project
        - url
        - status
        - pin_count
        - first_pin_feedback
        - reporter
        - updated_at
        - free_tier_locked
      properties:
        id:
          type: integer
          minimum: 1
        project:
          allOf:
            - $ref: "#/components/schemas/Project"
          nullable: true
        url:
          type: string
          format: uri
        status:
          type: string
          enum:
            - open
            - resolved
            - dismissed
        pin_count:
          type: integer
          minimum: 0
        first_pin_feedback:
          type: string
          maxLength: 200
        reporter:
          allOf:
            - $ref: "#/components/schemas/Reporter"
          nullable: true
        updated_at:
          type: string
          format: date-time
        free_tier_locked:
          type: boolean
    SessionDetail:
      type: object
      required:
        - id
        - status
        - project
        - reporter
        - url
        - updated_at
        - pins
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - open
            - resolved
            - dismissed
        project:
          allOf:
            - $ref: "#/components/schemas/Project"
          nullable: true
        reporter:
          allOf:
            - $ref: "#/components/schemas/Reporter"
          nullable: true
        url:
          type: string
          format: uri
        updated_at:
          type: string
          format: date-time
        pins:
          type: array
          items:
            $ref: "#/components/schemas/PinLite"
    PinLite:
      type: object
      required:
        - id
        - number
        - feedback
        - url
        - selector
        - element_info
        - metadata
      properties:
        id:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        feedback:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        selector:
          type: string
          nullable: true
        element_info:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
    PinFull:
      allOf:
        - $ref: "#/components/schemas/PinLite"
        - type: object
          properties:
            screenshot:
              allOf:
                - $ref: "#/components/schemas/Asset"
              nullable: true
            session_replay:
              allOf:
                - $ref: "#/components/schemas/Asset"
              nullable: true
            voice_note:
              allOf:
                - $ref: "#/components/schemas/Asset"
              nullable: true
            video_recording:
              allOf:
                - $ref: "#/components/schemas/Asset"
              nullable: true
            console:
              type: array
              items:
                $ref: "#/components/schemas/ConsoleLogItem"
            network:
              type: array
              items:
                $ref: "#/components/schemas/NetworkLogItem"
            events:
              type: array
              items:
                $ref: "#/components/schemas/UserEventItem"
    Asset:
      type: object
      required:
        - url
        - expires_at
        - content_type
        - size_bytes
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
          nullable: true
    ConsoleLogItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        datetime:
          type: string
        value: {}
        extra: {}
        full_url:
          type: string
        short_url:
          type: string
        epochTime:
          type: number
    NetworkLogItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        status:
          type: integer
        method:
          type: string
        full_url:
          type: string
        short_url:
          type: string
        epochTime:
          type: number
        headers: {}
        body: {}
    UserEventItem:
      type: object
      additionalProperties: true
      properties:
        target: {}
        type:
          type: string
        timestamp: {}
    SearchSessionsResponse:
      type: object
      required:
        - results
        - total
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
          minimum: 0
    SearchPinsResponse:
      type: object
      required:
        - results
        - total
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - pin
              - session
            properties:
              pin:
                $ref: "#/components/schemas/PinLite"
              session:
                $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
          minimum: 0
