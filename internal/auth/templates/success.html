<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="referrer-policy" content="no-referrer">
    <title>Disbug sign-in complete</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        font-size: 1.875rem;
        line-height: 1.2;
        margin: 0 0 1rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #f9fafb;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are signed in</h1>
      <p>Disbug CLI authorization is complete. You can close this tab and return to your terminal.</p>
    </main>
  </body>
</html>
