name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: check Go toolchain
        run: ./scripts/check-go-toolchain.sh
      - name: tools
        run: make tools
      - name: fmt-check
        run: make fmt-check
      - name: lint
        run: make lint
      - name: test
        run: make test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: check Go toolchain
        run: ./scripts/check-go-toolchain.sh
      - name: schema
        run: go test -tags schema ./internal/client/...

  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: check Go toolchain
        shell: bash
        run: ./scripts/check-go-toolchain.sh
      - name: build
        run: go build ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: check Go toolchain
        run: ./scripts/check-go-toolchain.sh
      - name: govulncheck
        run: make vuln
